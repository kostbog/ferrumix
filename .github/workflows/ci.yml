name: CI

# Build the kernel and run a real boot test in headless QEMU on every push
# and pull request. The kernel is freestanding (`no_std`), so instead of
# `cargo test` we boot it under QEMU and assert that it prints its banner.

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-boot:
    name: Build & boot test (QEMU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
          components: llvm-tools-preview,rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        # Non-blocking: reports style issues but does not fail the build.
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Build kernel
        run: cargo build --target x86_64-unknown-none

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Boot test (headless)
        run: make test
