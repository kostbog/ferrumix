# Build the kernel as a freestanding x86_64 binary (no std, no libc).
# Default target is still x86_64-unknown-none for stable toolchain compatibility
# (core is prebuilt). The custom Unix target `x86_64-ferrumix.json` from the
# roadmap is provided and can be built with nightly + `-Zbuild-std`:
#   cargo +nightly build --target x86_64-ferrumix.json -Zbuild-std=core,compiler_builtins
[build]
target = "x86_64-unknown-none"

# A kernel is loaded at a fixed physical address and is *not* position
# independent: the boot trampoline and the interrupt stub table use absolute
# addresses, so codegen must use the static relocation model and the linker
# must not produce a PIE.
[target.x86_64-unknown-none]
rustflags = [
  "-C", "relocation-model=static",
  "-C", "link-arg=--no-pie",
  "-C", "link-arg=-Tlinker.ld",
]

[target.x86_64-ferrumix]
rustflags = [
  "-C", "relocation-model=static",
  "-C", "link-arg=--no-pie",
  "-C", "link-arg=-Tlinker.ld",
]

# Cargo treats a `x86_64-ferrumix.json` file path as a target of its own, so the
# same flags are repeated for anything built for a bare-metal `target_os`.
[target.'cfg(target_os = "none")']
rustflags = [
  "-C", "relocation-model=static",
  "-C", "link-arg=--no-pie",
  "-C", "link-arg=-Tlinker.ld",
]
