# Build the kernel as a freestanding x86_64 binary (no std, no libc).
# Default target is still x86_64-unknown-none for stable toolchain compatibility
# (core is prebuilt). The custom Unix target `x86_64-ferrumix.json` from the
# roadmap is provided and can be built with nightly + `-Zbuild-std`:
#   cargo +nightly build --target x86_64-ferrumix.json -Zbuild-std=core,compiler_builtins
[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
# We provide our own linker script (see linker.ld) which lays out the kernel
# at 1 MiB physical and keeps the Multiboot2 header at the very front.
rustflags = [
  "-C", "link-arg=-Tlinker.ld",
]

[target.x86_64-ferrumix]
rustflags = [
  "-C", "link-arg=-Tlinker.ld",
]

# Cargo treats a `x86_64-ferrumix.json` file path as target; need to repeat flags
# for cfg when invoked via file path (cargo interprets target json filename as
# generic, but specifying both triples ensures linker script still used).
[target.'cfg(target_os = "none")']
rustflags = [
  "-C", "link-arg=-Tlinker.ld",
]
